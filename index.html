<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoChart Engine</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #chart-container {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>
  <!-- The Chart Div -->
  <div id="chart-container"></div>

  <!-- Start the Library -->
  <script type="module">
    import { EcoChart } from '/src/index.ts';

    const chart = new EcoChart('chart-container');
    chart.startLiveBinance('BTCUSDT', '1s'); // Using 1s so you can see it move immediately!
  </script>
</body>

</html>

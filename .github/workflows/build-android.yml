name: Build Android APK

on:
  push:
    branches: [ main ]  # Triggers automatically when you push to main
  workflow_dispatch:     # Allows you to click "Run workflow" manually on GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Node.js (Required for Capacitor CLI)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (JDK 17 for Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies & Build Web App
        run: |
          bun install
          bun run build

      - name: Initialize Capacitor Android (if not tracked) & Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Grant execute permission for Gradle wrapper
        working-directory: ./android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
